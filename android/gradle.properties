# Kotlin Build Tools API issue on Windows, aggravated by this project's path containing a
# space (E:\AES APP\...). Disabling incremental compilation avoids that broken codepath
# entirely; it only makes clean/first builds slightly slower, not correctness-affecting.
kotlin.incremental=false
